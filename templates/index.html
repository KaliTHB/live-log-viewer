<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>K8s Log Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:ui-monospace,Consolas,monospace;background:#0d1117;color:#c9d1d9;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:8px;padding:9px 14px;background:#161b22;border-bottom:1px solid #30363d;flex-wrap:wrap}
h1{color:#58a6ff;font-size:1rem;letter-spacing:1px;margin-right:10px}select,input,button{background:#0d1117;border:1px solid #30363d;color:#c9d1d9;padding:6px 8px;border-radius:4px;font:inherit;font-size:.78rem}
button{cursor:pointer;background:#21262d}button:hover{background:#30363d}.main{display:flex;flex:1;min-height:0}.sidebar{width:300px;max-width:40vw;background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;min-height:0}
.sidehead{padding:10px;color:#8b949e;border-bottom:1px solid #30363d;font-size:.75rem}.pod-list{overflow:auto;flex:1}.pod{padding:9px 12px;border-bottom:1px solid #21262d;cursor:pointer}.pod:hover,.pod.selected{background:#1f3a5f}.podname{font-size:.78rem;overflow-wrap:anywhere}.meta{color:#8b949e;font-size:.68rem;margin-top:4px}.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}.tag{font-size:.65rem;padding:3px;border:1px solid #30363d;color:#8b949e;cursor:pointer}.tag.active{border-color:#58a6ff;color:#58a6ff}
.log-area{display:flex;flex:1;flex-direction:column;min-width:0}.logtoolbar{display:flex;gap:8px;padding:8px;border-bottom:1px solid #30363d;align-items:center}.logtoolbar input{flex:1;min-width:80px}.logbox{flex:1;overflow:auto;padding:12px;background:#010409;font-size:.75rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}.logline{padding:1px 0}.err{color:#f85149}.warn{color:#e3b341}.ok{color:#3fb950}.highlight{background:#2d2a00;color:#e3b341}.status{padding:5px 10px;background:#161b22;color:#8b949e;border-top:1px solid #30363d;font-size:.7rem}
</style></head><body>
<div class="topbar"><h1>K8S LOGS</h1><select id="ns"></select><input id="podfilter" placeholder="filter pods..." style="width:130px"><button onclick="loadPods()">Refresh</button><button id="live" onclick="toggleLive()">Live: Off</button><button onclick="clearLogs()">Clear</button><select id="lines"><option>100</option><option selected>200</option><option>500</option><option>1000</option></select><button id="prev" onclick="togglePrevious()">Previous: Off</button><button onclick="saveLogs()">Save logs</button></div>
<div class="main"><aside class="sidebar"><div class="sidehead" id="podcount">Pods — loading</div><div class="pod-list" id="podlist"></div></aside>
<section class="log-area"><div class="logtoolbar"><span id="current">Select a pod</span><input id="filter" placeholder="search logs..." oninput="renderLogs()"><span id="matches"></span></div><div class="logbox" id="logbox">Choose a namespace and pod to view logs.</div><div class="status" id="status">Idle</div></section></div>
<script>
const BASE='/logs-viewer';let allPods=[],selectedPod=null,selectedContainer=null,live=false,source=null,previous=false,rawLog='';
const $=id=>document.getElementById(id);
async function loadNamespaces(){try{const r=await fetch(BASE+'/api/namespaces'),d=await r.json();if(!Array.isArray(d))throw Error(d.error||'Namespace request failed');$('ns').innerHTML=d.map(n=>`<option ${n==='outbreak-pulse'?'selected':''}>${escapeHtml(n)}</option>`).join('');await loadPods()}catch(e){$('status').textContent=e.message}}
async function loadPods(){try{const ns=$('ns').value;$('podcount').textContent='Pods — loading';const r=await fetch(BASE+'/api/pods?ns='+encodeURIComponent(ns)),d=await r.json();if(!Array.isArray(d))throw Error(d.error||'Pod request failed');allPods=d;$('podcount').textContent=`Pods — ${d.length}`;renderPods()}catch(e){$('status').textContent=e.message}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function renderPods(){const q=$('podfilter').value.toLowerCase();const pods=allPods.filter(p=>p.name.toLowerCase().includes(q));$('podlist').innerHTML=pods.map(p=>`<div class="pod ${selectedPod===p.name?'selected':''}" onclick="selectPod('${escapeHtml(p.name)}')"><div class="podname">${escapeHtml(p.name)}</div><div class="meta">${escapeHtml(p.phase)} · ready ${escapeHtml(p.ready)}</div><div class="tags">${[...(p.containers||[]),...(p.initContainers||[])].map(c=>`<span class="tag ${selectedPod===p.name&&selectedContainer===c?'active':''}" onclick="selectContainer('${escapeHtml(p.name)}','${escapeHtml(c)}',event)">${escapeHtml(c)}</span>`).join('')}</div></div>`).join('')||'<div class="sidehead">No pods found</div>'}
function selectPod(name){selectedPod=name;const p=allPods.find(x=>x.name===name);selectedContainer=p?.containers?.[0]||null;renderPods();fetchLogs()}
function selectContainer(pod,c,e){e.stopPropagation();selectedPod=pod;selectedContainer=c;renderPods();fetchLogs()}
async function fetchLogs(){if(!selectedPod)return;stopLive();$('current').textContent=selectedPod+(selectedContainer?' / '+selectedContainer:'');$('logbox').textContent='Loading logs…';const u=BASE+'/api/logs?ns='+encodeURIComponent($('ns').value)+'&pod='+encodeURIComponent(selectedPod)+'&lines='+$('lines').value+'&previous='+previous+(selectedContainer?'&container='+encodeURIComponent(selectedContainer):'');try{const r=await fetch(u),d=await r.json();rawLog=d.logs||d.error||'';renderLogs();$('status').textContent='Fetched '+new Date().toLocaleTimeString();if(live)startLive()}catch(e){$('logbox').textContent='Error: '+e.message}}
function renderLogs(){const q=$('filter').value.toLowerCase(),lines=rawLog.split('\n');let count=0;$('logbox').innerHTML=lines.filter(l=>!q||l.toLowerCase().includes(q)).map(l=>{if(q)count++;const cls=/error|exception|fatal|fail|traceback/i.test(l)?'err':/warn/i.test(l)?'warn':/success|complete|ready|started|healthy/i.test(l)?'ok':'';return `<div class="logline ${cls}">${escapeHtml(l)}</div>`}).join('');$('matches').textContent=q?count+' matches':'';$('logbox').scrollTop=$('logbox').scrollHeight}
function startLive(){if(!selectedPod)return;stopLive();const u=BASE+'/api/logs/stream?ns='+encodeURIComponent($('ns').value)+'&pod='+encodeURIComponent(selectedPod)+(selectedContainer?'&container='+encodeURIComponent(selectedContainer):'');source=new EventSource(u);$('status').textContent='Live stream connecting';source.onmessage=e=>{const line=JSON.parse(e.data);rawLog+=(rawLog?'\n':'')+line;renderLogs();$('status').textContent='Live · '+new Date().toLocaleTimeString()};source.onerror=()=>{$('status').textContent='Stream reconnecting or unavailable'};live=true;$('live').textContent='Live: On'}
function stopLive(){if(source){source.close();source=null} }
function toggleLive(){live=!live;if(live){startLive()}else{stopLive();$('live').textContent='Live: Off';$('status').textContent='Live stream stopped'}}
function togglePrevious(){previous=!previous;$('prev').textContent='Previous: '+(previous?'On':'Off');fetchLogs()}
function clearLogs(){rawLog='';renderLogs()}
function saveLogs(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rawLog],{type:'text/plain'}));a.download=(selectedPod||'pod')+'.log';a.click();URL.revokeObjectURL(a.href)}
$('ns').addEventListener('change',loadPods);$('podfilter').addEventListener('input',renderPods);loadNamespaces();setInterval(()=>{if(!live&&selectedPod)fetchLogs()},30000);
</script></body></html>
