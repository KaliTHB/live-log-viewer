apiVersion: v1
kind: ServiceAccount
metadata:
  name: logviewer-sa
  namespace: giva-d360
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: logviewer-role
rules:
- apiGroups: [""]
  resources: ["namespaces"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list"]
- apiGroups: [""]
  resources: ["pods/log"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: logviewer-rolebinding
subjects:
- kind: ServiceAccount
  name: logviewer-sa
  namespace: giva-d360
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: logviewer-role
